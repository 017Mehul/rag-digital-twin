[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-digital-twin"
version = "1.0.0"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.21.0",
  "faiss-cpu>=1.7.0",
  "openai>=1.0.0",
  "fastapi>=0.110.0",
  "pydantic>=2.0.0",
  "python-multipart>=0.0.9",
  "PyPDF2>=3.0.0",
  "python-docx>=0.8.11",
  "pyyaml>=6.0",
  "python-dotenv>=0.19.0",
]


[project.optional-dependencies]
test = ["pytest>=7.0.0", "hypothesis>=6.0.0", "pytest-cov>=4.0.0", "pytest-asyncio>=0.21.0", "httpx>=0.27.0"]
dev = ["black>=22.0.0", "flake8>=5.0.0", "mypy>=0.991"]
