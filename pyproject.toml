[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-digital-twin"
version = "1.5.0"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.5.3",
  "faiss-cpu>=1.15.1",
  "openai>=3.13.0",
  "fastapi>=0.143.0",
  "pydantic>=2.14.0",
  "python-multipart>=0.0.32",
  "pypdf>=6.19.0",
  "pyyaml>=6.0.3",
  "python-dotenv>=0.19.0",
]


[project.optional-dependencies]
test = ["pytest>=7.0.0", "hypothesis>=6.0.0", "pytest-cov>=4.0.0", "pytest-asyncio>=0.21.0", "httpx>=0.27.0"]
dev = ["black>=22.0.0", "flake8>=5.0.0", "mypy>=0.991", "pip-audit>=2.9.0"]
