# NVIDIA-powered production configuration for the RAG Digital Twin.

embedding:
  provider: "nvidia"
  model: "nvidia/nemotron-3-embed-1b"
  provider_config:
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://integrate.api.nvidia.com/v1"
    dimension: 2048

llm:
  provider: "nvidia"
  model: "openai/gpt-oss-20b"
  provider_config:
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://integrate.api.nvidia.com/v1"

document_processing:
  chunk_size: 1000
  chunk_overlap: 200

retrieval:
  top_k_results: 5
  similarity_threshold: 0.7
  max_context_length: 4000

response:
  max_tokens: 500
  temperature: 0.1

system:
  batch_size: 10
  max_retries: 3
  timeout_seconds: 30

paths:
  data_directory: "data"
  embeddings_directory: "embeddings"
  logs_directory: "logs"
